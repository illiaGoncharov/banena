name: Deploy to hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "deploy-hosting"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Secrets: FTP_HOST, FTP_USER, FTP_PASSWORD, FTP_REMOTE_DIR
      # Optional: FTP_PORT (default 21), FTP_SSL=1 for FTPS
      - name: Install lftp
        if: ${{ secrets.FTP_HOST != '' }}
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via FTP
        if: ${{ secrets.FTP_HOST != '' }}
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SSL: ${{ secrets.FTP_SSL }}
        run: bash scripts/deploy-hosting.sh

      - name: Skip deploy (secrets missing)
        if: ${{ secrets.FTP_HOST == '' }}
        run: |
          echo "::warning::FTP_HOST secret is not set. Build OK, deploy skipped."
          echo "Add repo secrets: FTP_HOST, FTP_USER, FTP_PASSWORD, FTP_REMOTE_DIR"
